<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XMind Viewer</title>
  </head>
  <body>
    <header>
      <strong>XMind Viewer</strong>
      <button type="button" id="open-file">打开 XMind 文件</button>
      <button type="button" id="save-file">保存</button>
      <button type="button" id="add-child">添加子主题</button>
      <button type="button" id="add-sibling">添加同级主题</button>
      <button type="button" id="add-floating">添加自由主题</button>
      <button type="button" id="delete-topic">删除</button>
      <button type="button" id="fold-topic">折叠 / 展开</button>
      <button type="button" id="tag-red">红色标签</button>
      <button type="button" id="flag-red">红旗</button>
      <label>标记 <select id="marker-select" aria-label="选择标记"></select></label>
      <button type="button" id="toggle-marker">添加 / 移除标记</button>
      <button type="button" id="insert-image">插入图片</button>
      <input id="image-dialog" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
      <label>图片宽度 <input id="image-width" type="number" min="1" max="2000" value="200" /></label>
      <button type="button" id="resize-image">调整图片</button>
      <button type="button" id="undo">撤销</button>
      <button type="button" id="redo">重做</button>
      <button type="button" id="zoom-out" aria-label="缩小">−</button>
      <button type="button" id="zoom-in" aria-label="放大">+</button>
      <input id="input-dialog" type="file" accept=".xmind" aria-label="选择 XMind 文件" hidden />
      <span id="status" role="status" aria-live="polite"></span>
    </header>
    <main id="page-content" aria-label="思维导图"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
